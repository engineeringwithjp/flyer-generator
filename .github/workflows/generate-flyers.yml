name: Generate flyers

# The daily production run. The same pipeline serves the schedule and the
# manual button - there is deliberately only one implementation.
on:
  schedule:
    # GitHub Actions cron is UTC only, so 10:07 America/New_York is two
    # different UTC times across the year. Both fire; `flyer schedule-check`
    # decides which one is really 10:07 locally and the other exits in seconds.
    - cron: "7 14 * * 1-5"   # 10:07 EDT (Mar-Nov)
    - cron: "7 15 * * 1-5"   # 10:07 EST (Nov-Mar)

    # TO RUN EVERY FEW HOURS INSTEAD: comment out the two lines above,
    # uncomment the line below, and set these repository variables:
    #   SCHEDULE_MODE=interval
    #   SCHEDULE_INTERVAL_HOURS=3
    #   SCHEDULE_WINDOW=08:00-20:00
    # The hourly trigger is deliberate: it is the only DST-proof way to hit
    # arbitrary local slots. Runs outside a slot exit in about 20 seconds.
    # - cron: "7 * * * *"

  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        required: false
        default: all-elite
        type: string
      count:
        description: How many flyers
        required: false
        default: "2"
        type: string
      campaign:
        description: Campaign id or service (blank = the planner decides)
        required: false
        default: ""
        type: string
      message:
        description: 'The one thing this flyer is about, e.g. "built-in insulation"'
        required: false
        default: ""
        type: string
      cta:
        description: Override the call to action
        required: false
        default: ""
        type: string
      tools:
        description: 'Connector override, e.g. "use canva", "no stock photography", "internal only"'
        required: false
        default: ""
        type: string
      upload:
        description: Upload to Google Drive
        required: false
        default: true
        type: boolean

concurrency:
  group: flyers-${{ inputs.client || 'all-elite' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    name: ${{ inputs.client || 'all-elite' }} - ${{ inputs.count || 2 }} flyer(s)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # A scheduled run only proceeds at the real local time. A manual run
      # always proceeds.
      - name: Is this a scheduled slot in New Jersey?
        id: window
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_MODE: ${{ vars.SCHEDULE_MODE || 'daily' }}
          SCHEDULE_INTERVAL_HOURS: ${{ vars.SCHEDULE_INTERVAL_HOURS || '3' }}
          SCHEDULE_WINDOW: ${{ vars.SCHEDULE_WINDOW || '08:00-20:00' }}
          SCHEDULE_DAYS: ${{ vars.SCHEDULE_DAYS || 'mon-fri' }}
        run: python -m app.cli schedule-check --tolerance 40 || echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Skip the duplicate UTC slot
        if: github.event_name == 'schedule' && steps.window.outputs.should_run != 'true'
        run: |
          echo "### Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Not a scheduled slot in \`America/New_York\` right now." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate configuration
        if: github.event_name != 'schedule' || steps.window.outputs.should_run == 'true'
        run: python -m app.cli validate

      - name: Fast tests
        if: github.event_name != 'schedule' || steps.window.outputs.should_run == 'true'
        run: pytest -q -m "not integration" -x

      - name: Generate
        id: generate
        if: github.event_name != 'schedule' || steps.window.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          SCHEDULE_MODE: ${{ vars.SCHEDULE_MODE || 'daily' }}
          SCHEDULE_INTERVAL_HOURS: ${{ vars.SCHEDULE_INTERVAL_HOURS || '3' }}
          SCHEDULE_WINDOW: ${{ vars.SCHEDULE_WINDOW || '08:00-20:00' }}
          SCHEDULE_DAYS: ${{ vars.SCHEDULE_DAYS || 'mon-fri' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
        run: |
          ARGS=(--client "${{ inputs.client || 'all-elite' }}" --count "${{ inputs.count || 2 }}")
          [ -n "${{ inputs.campaign }}" ] && ARGS+=(--campaign "${{ inputs.campaign }}")
          [ -n "${{ inputs.message }}" ]  && ARGS+=(--message  "${{ inputs.message }}")
          [ -n "${{ inputs.cta }}" ]      && ARGS+=(--cta      "${{ inputs.cta }}")
          [ -n "${{ inputs.tools }}" ]    && ARGS+=(--tools    "${{ inputs.tools }}")
          if [ "${{ inputs.upload }}" = "false" ]; then ARGS+=(--no-upload); fi
          python -m app.cli generate "${ARGS[@]}"
        continue-on-error: true

      - name: Upload the flyers as an artifact
        if: steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: flyers-${{ inputs.client || 'all-elite' }}-${{ github.run_number }}
          path: |
            output/**/*.png
            output/**/*.jpg
            output/**/*.json
            output/**/SUMMARY.md
          if-no-files-found: warn
          retention-days: 30

      # History is the memory that stops the system repeating itself, so it is
      # committed back to the repository rather than living only in the run.
      - name: Commit generation history
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name  "flyer-generator[bot]"
          git config user.email "flyer-generator[bot]@users.noreply.github.com"
          git add data/generation-history data/assets/index.json data/references/index.json || true
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore(history): record run ${{ steps.generate.outputs.run_id }}"
            git push
          fi

      - name: Open the daily review issue
        if: steps.generate.outcome == 'success'
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ steps.generate.outputs.run_id }}
          PASSED: ${{ steps.generate.outputs.flyers_passed }}
          TOTAL: ${{ steps.generate.outputs.flyers_generated }}
          # Passed through the environment rather than interpolated into the
          # script body. A `${{ }}` expression only accepts single-quoted
          # strings, and a double-quoted one here made the whole file
          # unparseable - which silently un-registered the `schedule:` triggers,
          # so the daily run never fired at all. env: has no such trap.
          CLIENT: ${{ inputs.client || 'all-elite' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const client = process.env.CLIENT;
            const today = new Date().toISOString().slice(0, 10);

            let summary = '';
            const base = path.join('output', today, client, 'SUMMARY.md');
            if (fs.existsSync(base)) summary = fs.readFileSync(base, 'utf8');

            const artifact =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const body = [
              summary,
              '',
              `[Download the flyers](${artifact}) (artifact on this run).`,
              '',
              '---',
              '',
              '### Review',
              '',
              'Comment on this issue to record a decision. One per line:',
              '',
              '```',
              'approve <flyer_id>',
              'reject <flyer_id> headline too small, CTA weak',
              '```',
              '',
              'Approvals raise the score of the references that produced them; rejections lower it.',
            ].join('\n');

            const title = `Flyer review - ${client} - ${today}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'flyer-review',
            });
            const match = existing.data.find(i => i.title === title);

            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['flyer-review'],
              });
            }

      - name: Fail the run if generation failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::Flyer generation failed. See the log above." 
          exit 1
