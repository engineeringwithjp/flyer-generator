name: Publish flyer gallery

# A private-by-default static gallery of everything generated, so a week of
# flyers can be reviewed from a phone.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate flyers"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          fonts: "false"
          extras: "dev"

      # Flyers are gitignored, so the gallery is built from the most recent
      # generation artifacts rather than from the repository.
      - name: Pull recent flyer artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: flyers-*
          path: output
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Build
        run: python -m app.cli gallery --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
